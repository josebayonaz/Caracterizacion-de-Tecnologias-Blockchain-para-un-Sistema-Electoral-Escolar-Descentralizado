# Configuración de Red (Tus instancias en AWS)
network:
  name: "Tesis-Avalanche-Subnet"
  type: "ethereum" # La Subnet usa la EVM, así que para Diablo es un endpoint tipo Ethereum
  nodes:
    - "http://127.0.0.1:9654/ext/bc/V2mXsgv43ogmPvw1pJJqcuNoZMQTBFnn8xbh98CzF2bH21AcK/rpc"
    # Añadiremos los otros 3 nodos aquí usando sus IPs privadas (ej. 10.0.0.X) 
    # cuando los enciendas.

# Configuración de la Carga (Workload)
workload:
  name: "Votacion-Escolar-Stress-Test"
  type: "smart_contract"
  contract_address: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
  abi_file: "school_elections.abi"
  
  # Función a llamar en el contrato
  function: "vote"
  
  # Parámetros de la función: Pasaremos el ID 1 (Voto en Blanco) 
  # para que no falle la validación si un candidato llega a su límite
  params:
    - 1

# Parámetros de Inyección (El estrés)
bench:
  clients: 1000       # Número de votantes concurrentes (haciendo match con tu script)
  txs_per_second: 500 # TPS objetivo para estresar la RAM/CPU de las instancias
  duration: 60        # Duración de la prueba en segundos
  accounts_file: "voters_diablo.json"